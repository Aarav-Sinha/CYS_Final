<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Participant Portal — Critically Yours</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --gold:#C9A84C;--gold-dim:#8B6914;--green:#4A7C59;--green-light:#6BAA7D;
  --red:#C0392B;--red-light:#e74c3c;
  --bg-dark:#080A06;--bg-sidebar:#0D0F0B;
  --bg-card:rgba(255,255,255,0.04);--bg-card-hover:rgba(255,255,255,0.07);
  --glass:rgba(201,168,76,0.08);
  --text-primary:#F5EDD6;--text-secondary:#A89060;
  --border:rgba(201,168,76,0.15);
}
[data-theme="light"]{
  --bg-dark:#F0EBE0;--bg-sidebar:#E8E0D0;
  --bg-card:rgba(0,0,0,0.04);--bg-card-hover:rgba(0,0,0,0.07);
  --glass:rgba(201,168,76,0.1);
  --text-primary:#1A1208;--text-secondary:#6B5020;
  --border:rgba(201,168,76,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Josefin Sans',sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;display:flex;transition:background 0.3s,color 0.3s;}
.sidebar{width:230px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;}
.sb-logo{padding:22px 18px;border-bottom:1px solid var(--border);font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--gold);letter-spacing:2px;}
.sb-logo span{display:block;font-size:0.55rem;letter-spacing:3px;color:var(--text-secondary);margin-top:2px;font-family:'Josefin Sans',sans-serif;}
.sb-user{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex-shrink:0;}
.sb-user-info{flex:1;min-width:0;}
.sb-name{font-size:0.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-role{font-size:0.58rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
.sb-nav{flex:1;padding:10px 0;}
.sb-section{font-size:0.52rem;letter-spacing:3px;color:var(--text-secondary);text-transform:uppercase;padding:10px 18px 5px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:0.7rem;letter-spacing:1px;color:var(--text-secondary);cursor:pointer;transition:all 0.2s;border:none;background:none;width:100%;text-align:left;}
.sb-item:hover,.sb-item.active{color:var(--gold);background:var(--glass);}
.sb-item.active{border-left:2px solid var(--gold);}
.sb-bottom{padding:14px 18px;border-top:1px solid var(--border);}
.sb-signout{width:100%;padding:8px;border-radius:6px;background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.3);color:var(--red-light);font-family:'Josefin Sans',sans-serif;font-size:0.62rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;}
.sb-signout:hover{background:rgba(192,57,43,0.2);}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-dark);position:sticky;top:0;z-index:10;}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--text-primary);}
.theme-toggle{width:32px;height:32px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.content{padding:24px;flex:1;}
.panel{display:none;}.panel.active{display:block;animation:fadeUp 0.4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* STATUS BANNER */
.status-banner{border-radius:10px;padding:20px 24px;margin-bottom:24px;border:1px solid var(--border);}
.status-banner.pending{background:rgba(201,168,76,0.08);border-color:rgba(201,168,76,0.3);}
.status-banner.selected{background:rgba(74,124,89,0.1);border-color:rgba(74,124,89,0.35);}
.status-banner.rejected{background:rgba(192,57,43,0.08);border-color:rgba(192,57,43,0.3);}
.sb-icon{font-size:1.8rem;margin-bottom:8px;}
.sb-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;}
.sb-title.pending{color:var(--gold);}
.sb-title.selected{color:var(--green-light);}
.sb-title.rejected{color:var(--red-light);}
.sb-desc{font-size:0.78rem;color:var(--text-secondary);margin-top:6px;line-height:1.7;}

/* CARDS */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;}
.info-label{font-size:0.58rem;letter-spacing:2px;color:var(--text-secondary);text-transform:uppercase;margin-bottom:6px;}
.info-val{font-size:0.9rem;color:var(--text-primary);font-weight:600;}

/* ANNOUNCEMENTS */
.ann-list{display:flex;flex-direction:column;gap:10px;}
.ann-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;transition:all 0.2s;}
.ann-card:hover{background:var(--bg-card-hover);}
.ann-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ann-from{font-size:0.6rem;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;}
.ann-time{font-size:0.6rem;color:var(--text-secondary);}
.ann-title{font-size:0.88rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;}
.ann-body{font-family:'Cormorant Garamond',serif;font-size:0.95rem;color:var(--text-secondary);line-height:1.6;}

/* TASKS */
.task-list{display:flex;flex-direction:column;gap:10px;}
.task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;}
.task-title{font-size:0.88rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;}
.task-body{font-size:0.8rem;color:var(--text-secondary);line-height:1.6;}
.task-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:0.58rem;letter-spacing:1px;text-transform:uppercase;background:var(--glass);border:1px solid var(--border);color:var(--gold);}

/* QR CODE */
.qr-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:32px;text-align:center;max-width:300px;margin:0 auto;}
.qr-wrap canvas{border-radius:8px;margin:16px auto;display:block;}
.qr-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--text-primary);margin-bottom:4px;}
.qr-sub{font-size:0.68rem;letter-spacing:1px;color:var(--text-secondary);}
.qr-id{font-size:0.7rem;color:var(--gold);margin-top:10px;letter-spacing:2px;}

/* TICKET FLOATING */
.ticket-fab{position:fixed;bottom:24px;right:24px;z-index:50;padding:12px 20px;border-radius:28px;background:linear-gradient(135deg,var(--green),#2C4A35);color:var(--text-primary);font-family:'Josefin Sans',sans-serif;font-size:0.68rem;letter-spacing:2px;font-weight:600;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(74,124,89,0.4);transition:all 0.3s;}
.ticket-fab:hover{transform:translateY(-2px);}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--bg-dark);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:440px;animation:fadeUp 0.3s ease;}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--gold);margin-bottom:6px;}
.modal p{font-size:0.75rem;color:var(--text-secondary);margin-bottom:20px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:0.6rem;letter-spacing:2px;color:var(--text-secondary);text-transform:uppercase;margin-bottom:6px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border-radius:6px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);font-family:'Josefin Sans',sans-serif;font-size:0.82rem;outline:none;transition:border 0.2s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold);}
.fg textarea{resize:vertical;min-height:70px;}
.fg select option{background:var(--bg-dark);}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn-primary{padding:10px 24px;border-radius:6px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#0A0C08;font-family:'Josefin Sans',sans-serif;font-size:0.7rem;font-weight:600;letter-spacing:2px;border:none;cursor:pointer;transition:all 0.2s;}
.btn-cancel{padding:10px 16px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text-secondary);font-family:'Josefin Sans',sans-serif;font-size:0.7rem;cursor:pointer;}
.btn-cancel:hover{border-color:var(--gold);color:var(--gold);}

/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--text-secondary);}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:12px;color:var(--border);}
.empty-state p{font-size:0.8rem;letter-spacing:1px;}

/* REJECTED MSG */
.rejected-msg{background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.3);border-radius:10px;padding:20px 24px;margin-bottom:20px;}
.rejected-msg p{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--text-secondary);line-height:1.7;}

.mobile-btn{display:none;}

@media(max-width:640px){
  body{flex-direction:column;}
  .sidebar{width:100%;height:60px;position:sticky;top:0;z-index:100;flex-direction:row;align-items:center;justify-content:space-between;padding:0 16px;overflow:visible;border-right:none;border-bottom:1px solid var(--border);}
  .sb-logo{padding:0;border:none;}
  .sb-logo span{display:inline;margin-left:6px;margin-top:0;}
  .sb-user,.sb-nav,.sb-bottom{display:none;}
  
  .sidebar.open .sb-user {
    display: flex; position: fixed; top: 60px; left: 0; right: 0; background: var(--bg-sidebar); padding: 14px 18px; border-bottom: 1px solid var(--border); z-index: 99;
  }
  .sidebar.open .sb-nav {
    display: flex; flex-direction: column; position: fixed; top: 126px; left: 0; right: 0; background: var(--bg-sidebar); padding: 10px 0; z-index: 99; border-bottom: 1px solid var(--border);
  }
  .sidebar.open .sb-bottom {
    display: flex; position: fixed; top: 380px; left: 0; right: 0; background: var(--bg-sidebar); padding: 14px 18px; z-index: 99; border-bottom: 1px solid var(--border);
  }
  
  .mobile-btn{display:flex;width:34px;height:34px;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--gold);cursor:pointer;font-size:18px;}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sb-logo">Critically Yours<span>Participant Portal</span></div>
  <div class="sb-user">
    <img class="sb-avatar" id="sbAvatar" src="" alt="">
    <div class="sb-user-info">
      <div class="sb-name" id="sbName">Loading...</div>
      <div class="sb-role">Participant</div>
    </div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">My Portal</div>
    <button class="sb-item active" onclick="showPanel('home',this)">&#9670; My Status</button>
    <button class="sb-item" onclick="showPanel('announcements',this)">&#9670; Announcements</button>
    <button class="sb-item" onclick="showPanel('tasks',this)">&#9670; Tasks</button>
    <button class="sb-item" onclick="showPanel('qr',this)">&#9632; My QR / ID</button>
    <button class="sb-item" onclick="showPanel('profile',this)">&#9671; My Profile</button>
  </nav>
  <div class="sb-bottom">
    <button class="sb-signout" onclick="doSignOut()">Sign Out</button>
  </div>
  <button class="mobile-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">My Status</div>
    <button class="theme-toggle" id="themeToggle">&#9790;</button>
  </div>
  <div class="content">

    <div class="panel active" id="panel-home">
      <div id="statusBanner"></div>
      <div class="info-grid" id="infoGrid"></div>
    </div>

    <div class="panel" id="panel-announcements">
      <div class="ann-list" id="annList">
        <div class="empty-state"><div class="es-icon">&#9670;</div><p>Loading announcements...</p></div>
      </div>
    </div>

    <div class="panel" id="panel-tasks">
      <div class="task-list" id="taskList">
        <div class="empty-state"><div class="es-icon">&#9636;</div><p>Loading tasks...</p></div>
      </div>
    </div>

    <div class="panel" id="panel-qr">
      <div class="qr-wrap">
        <div class="qr-title">Identity Card</div>
        <div class="qr-sub">Scan at event entry for attendance</div>
        <canvas id="qrCanvas"></canvas>
        <div class="qr-id" id="qrIdLabel"></div>
        <div style="margin-top:12px;font-size:0.75rem;color:var(--text-secondary);" id="qrNameLabel"></div>
      </div>
    </div>

    <div class="panel" id="panel-profile">
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:500px;">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
          <img id="profileAvatar" src="" style="width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;" alt="">
          <div>
            <div id="profileName" style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--text-primary);"></div>
            <div id="profileEmail" style="font-size:0.7rem;color:var(--gold);margin-top:2px;"></div>
          </div>
        </div>
        <div id="profileDetails"></div>
      </div>
    </div>

  </div>
</div>

<button class="ticket-fab" onclick="document.getElementById('ticketModal').classList.add('active')">&#9873; Raise Ticket</button>

<div class="modal-overlay" id="ticketModal">
  <div class="modal">
    <h3>Raise a Ticket</h3>
    <p>Report any issue you are facing.</p>
    <div class="fg"><label>Category</label><select id="tCat"><option value="technical">Technical Issue</option><option value="conduct">Conduct / Abuse</option><option value="event">Event Issue</option><option value="other">Other</option></select></div>
    <div class="fg"><label>Description</label><textarea id="tDesc" placeholder="Describe your issue..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('ticketModal').classList.remove('active')">Cancel</button>
      <button class="btn-primary" onclick="submitTicket()">Submit</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyBKeQxNTRaGsry7vpHZOBOD6CCuvZhBpU0",
  authDomain:"critically-yours-v5.firebaseapp.com",
  projectId:"critically-yours-v5",
  storageBucket:"critically-yours-v5.firebasestorage.app",
  messagingSenderId:"436240015995",
  appId:"1:436240015995:web:e646abe16d80d7eab9f8de"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// THEME
const themeToggle = document.getElementById('themeToggle');
const saved = localStorage.getItem('cy_theme')||'dark';
document.documentElement.setAttribute('data-theme',saved);
themeToggle.textContent = saved==='dark'?'☀':'☾';
themeToggle.addEventListener('click',()=>{
  const t = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('cy_theme',t);
  themeToggle.textContent=t==='dark'?'☀':'☾';
});

let myReg = null;
let myUser = null;

// Helper to convert Firebase Class IDs to Readable Roman Numerals
function getClassDisplay(classId) {
  const classMap = {
    'uG0Ws6m9bwhfO9qx287g': 'IX',
    'QZB5Rsr266mScA4HMCLI': 'X',
    '40k6FtJzbOXqKVYteeDf': 'XI'
  };
  return classMap[classId] || classId || '';
}

// AUTH GUARD
onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href='login.html'; return; }

  // Check portal open
  const settingsSnap = await getDoc(doc(db,'settings','global'));
  if (settingsSnap.exists() && settingsSnap.data().participantPortalOpen === false) {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:40px;">
      <div><div style="font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold);margin-bottom:12px;">Portal Under Maintenance</div>
      <p style="color:var(--text-secondary);">The participant portal is currently unavailable. Please check back later.</p></div></div>`;
    return;
  }

  myUser = user;
  document.getElementById('sbAvatar').src = user.photoURL||'';
  document.getElementById('sbName').textContent = user.displayName||user.email;

  // Load registration
  const regSnap = await getDocs(query(collection(db,'registrations'), where('email','==',user.email)));
  if (regSnap.empty) {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:40px;">
      <div><div style="font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold);margin-bottom:12px;">No Registration Found</div>
      <p style="color:var(--text-secondary);margin-bottom:20px;">You have not enrolled yet.</p>
      <a href="enroll.html" style="padding:12px 28px;border-radius:6px;background:linear-gradient(135deg,#C9A84C,#8B6914);color:#0A0C08;font-size:0.75rem;font-weight:600;letter-spacing:2px;text-decoration:none;">Enroll Now</a></div></div>`;
    return;
  }

  myReg = { id: regSnap.docs[0].id, ...regSnap.docs[0].data() };
  initParticipant();
});

async function initParticipant() {
  loadStatus();
  loadAnnouncements();
  loadTasks();
  loadQR();
  loadProfile();
}

function loadStatus() {
  const banner = document.getElementById('statusBanner');
  const grid = document.getElementById('infoGrid');
  const status = myReg.status || 'audition_pending';

  const statusMap = {
    audition_pending: { cls:'pending', icon:'&#9670;', title:'Audition Pending', desc:'Your enrollment has been received. The Event Head will review your application after auditions. You will be notified of the result.' },
    selected: { cls:'selected', icon:'&#10003;', title:'Selected!', desc:'Congratulations! You have been selected for the event. Welcome to the team. Check announcements and tasks from your Event Head.' },
    rejected: { cls:'rejected', icon:'&#10007;', title:'Not Selected', desc:'We regret to inform you that you have not been selected for this event. Thank you for participating. Better luck next time!' }
  };
  const s = statusMap[status] || statusMap.audition_pending;
  banner.innerHTML = `<div class="status-banner ${s.cls}"><div class="sb-icon">${s.icon}</div><div class="sb-title ${s.cls}">${s.title}</div><div class="sb-desc">${s.desc}</div></div>`;

  if (status === 'rejected') {
    banner.innerHTML += `<div class="rejected-msg"><p>We appreciate your enthusiasm and hard work. We encourage you to keep pursuing your passion. Critically Yours wishes you all the best in your future endeavours.</p></div>`;
  }

  // Info cards
  const eventName = myReg.eventId || '--';
  const readableClass = getClassDisplay(myReg.class);
  grid.innerHTML = `
    <div class="info-card"><div class="info-label">Event</div><div class="info-val" id="eventNameCard">Loading...</div></div>
    <div class="info-card"><div class="info-label">Class</div><div class="info-val">${readableClass} &ndash; ${myReg.section||''}</div></div>
    <div class="info-card"><div class="info-label">Roll Number</div><div class="info-val">${myReg.rollNumber||''}</div></div>
    <div class="info-card"><div class="info-label">Registered On</div><div class="info-val">${myReg.createdAt?.toDate?myReg.createdAt.toDate().toLocaleDateString('en-IN'):''}</div></div>
  `;
  // Fetch event name
  getDoc(doc(db,'events',myReg.eventId)).then(snap => {
    if (snap.exists()) document.getElementById('eventNameCard').textContent = snap.data().name||'--';
  }).catch(()=>{});
}

async function loadAnnouncements() {
  const list = document.getElementById('annList');
  try {
    const status = myReg.status;
    const snap = await getDocs(query(collection(db,'announcements'), orderBy('createdAt','desc')));
    const relevant = [];
    snap.forEach(d => {
      const a = d.data();
      const t = a.targets || [];
      const isPublic = t.includes('public') || t.includes('all');
      const isParticipant = t.includes('participant') && status === 'selected';
      const isEventSpecific = a.eventId === myReg.eventId;
      if (isPublic || isParticipant || (isEventSpecific && status === 'selected')) relevant.push(a);
    });
    if (!relevant.length) { list.innerHTML = '<div class="empty-state"><div class="es-icon">&#9670;</div><p>No announcements yet.</p></div>'; return; }
    list.innerHTML = '';
    relevant.forEach(a => {
      const time = a.createdAt?.toDate ? a.createdAt.toDate().toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      list.innerHTML += `<div class="ann-card">
        <div class="ann-meta"><span class="ann-from">${a.postedBy||'Team'}</span><span class="ann-time">${time}</span></div>
        <div class="ann-title">${a.title||''}</div>
        <div class="ann-body">${a.body||''}</div>
      </div>`;
    });
  } catch(e) { list.innerHTML = '<div class="empty-state"><p>Failed to load.</p></div>'; }
}

async function loadTasks() {
  const list = document.getElementById('taskList');
  if (myReg.status !== 'selected') {
    list.innerHTML = '<div class="empty-state"><div class="es-icon">&#9636;</div><p>Tasks are visible only to selected participants.</p></div>';
    return;
  }
  try {
    const snap = await getDocs(query(collection(db,'tasks'), where('participantId','==',myReg.id)));
    if (snap.empty) { list.innerHTML = '<div class="empty-state"><div class="es-icon">&#9636;</div><p>No tasks assigned yet.</p></div>'; return; }
    list.innerHTML = '';
    snap.forEach(d => {
      const t = d.data();
      list.innerHTML += `<div class="task-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div class="task-title">${t.title||''}</div>
          <span class="task-badge">${t.status||'pending'}</span>
        </div>
        <div class="task-body">${t.description||''}</div>
        ${t.assignedBy?`<div style="font-size:0.65rem;color:var(--gold);margin-top:8px;">Assigned by: ${t.assignedBy}</div>`:''}
      </div>`;
    });
  } catch(e) { list.innerHTML = '<div class="empty-state"><p>Failed to load tasks.</p></div>'; }
}

function loadQR() {
  const canvas = document.getElementById('qrCanvas');
  const qrId = myReg.qrId || myReg.id;
  QRCode.toCanvas(canvas, qrId, { width: 180, margin: 2, color: { dark: '#C9A84C', light: '#00000000' } }, err => {
    if (err) { canvas.parentElement.innerHTML += '<p style="color:var(--red-light);font-size:0.75rem;">QR generation failed.</p>'; }
  });
  document.getElementById('qrIdLabel').textContent = 'ID: ' + qrId;
  document.getElementById('qrNameLabel').textContent = myReg.name || '';
}

function loadProfile() {
  document.getElementById('profileAvatar').src = myReg.photoURL || myUser.photoURL || '';
  document.getElementById('profileName').textContent = myReg.name || '';
  document.getElementById('profileEmail').textContent = myReg.email || '';
  
  const readableClass = getClassDisplay(myReg.class);
  document.getElementById('profileDetails').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      ${infoRow('Registration No.', myReg.registrationNumber)}
      ${infoRow('Class', (readableClass) + ' \u2013 ' + (myReg.section||''))}
      ${infoRow('Roll Number', myReg.rollNumber)}
      ${infoRow('Class Teacher', myReg.classTeacher)}
      ${infoRow('Calling No.', myReg.callingNumber)}
      ${infoRow('WhatsApp', myReg.whatsappNumber)}
    </div>`;
}
function infoRow(label, val) {
  return `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;">
    <div style="font-size:0.58rem;letter-spacing:2px;color:var(--text-secondary);text-transform:uppercase;margin-bottom:4px;">${label}</div>
    <div style="font-size:0.85rem;color:var(--text-primary);">${val||'&mdash;'}</div>
  </div>`;
}

window.showPanel = (id, btn) => {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  if (btn) btn.classList.add('active');
  document.getElementById('topbarTitle').textContent = btn ? btn.textContent.trim() : id;
  
  document.getElementById('sidebar').classList.remove('open');
};

window.submitTicket = async () => {
  const cat = document.getElementById('tCat').value;
  const desc = document.getElementById('tDesc').value.trim();
  if (!desc) { alert('Please describe the issue.'); return; }
  try {
    await addDoc(collection(db,'tickets'), {
      name: myReg.name, email: myReg.email,
      category: cat, description: desc,
      status:'open', createdAt: serverTimestamp()
    });
    document.getElementById('ticketModal').classList.remove('active');
    document.getElementById('tDesc').value='';
    alert('Ticket submitted successfully.');
  } catch(e) { alert('Failed to submit: '+e.message); }
};

window.doSignOut = async () => { await signOut(auth); window.location.href='login.html'; };
</script>
</body>
</html>
